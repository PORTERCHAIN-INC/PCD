<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PorterChain feature media</title>
    <link rel="stylesheet" href="listing.css" />
  </head>
  <body>
    <div class="feature">
      <div>
        <div class="word">
          <img src="../../../website/public/brand/porterchain-mark-white.png" alt="" />
          porterchain
        </div>
        <h1>Same-day capacity at checkout.</h1>
        <p class="note">
          The store asks PorterChain. The rate uses the pickup address, the postal code, and the
          order weight.
        </p>
      </div>
      <div class="fcard">
        <div class="kicker">Checkout · Shipping</div>
        <h2>PorterChain Same Day</h2>
        <div class="opt on" style="margin-top: 18px">
          <div class="radio"><i></i></div>
          <div>
            <strong>PorterChain Same Day</strong>
            <p>Same-day local capacity</p>
          </div>
          <div class="price">$18.40</div>
        </div>
        <p class="sub" style="margin-top: 14px">Quoted for this cart. Phone number required.</p>
      </div>
    </div>
  </body>
</html>
