# Shopify Partners manifest stub for a later public listing.
# Runtime SSOT: PorterChain API (OAuth scopes, install webhooks, CarrierService).
# Keep client_id empty until Partners publish is an explicit ops decision.
# Merchant portal already offers one-click OAuth install (invite / known shop domain).
# FO request topics stay out of this file — they register only when
# SHOPIFY_FULFILLMENT_SERVICE_ENABLED=true (default off). Accept is implemented
# behind that flag. client_id stays empty until a public listing is an ops decision.
# read_returns + returns/* topics: release this version in Partners first, then set
# SHOPIFY_RETURNS_SCOPE_ENABLED=true so OAuth asks for it (API registers returns
# webhooks via GraphQL only when the shop granted read_returns).
# API 2026-10: carrier services are no longer auto-added to the General shipping
# profile; merchants switch PorterChain rates on in Shipping and delivery / Markets.

name = "PorterChain"
client_id = ""
application_url = "https://merchant.porterchain.com/shopify"
embedded = false

[access_scopes]
scopes = "read_orders,write_fulfillments,write_shipping,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_returns"
use_legacy_install_flow = true

[auth]
redirect_urls = [ "https://api.porterchain.com/v1/integrations/shopify/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [
    "orders/create",
    "orders/updated",
    "orders/edited",
    "orders/paid",
    "orders/cancelled",
    "orders/delete",
    "refunds/create",
    "app/uninstalled",
    "returns/approve",
    "returns/cancel"
  ]
  uri = "https://api.porterchain.com/v1/integrations/shopify/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://api.porterchain.com/v1/integrations/shopify/webhooks"
