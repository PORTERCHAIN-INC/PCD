# This file is the Shopify Partners manifest for a later public listing.
# Runtime lives in the PorterChain API (`POST /v1/integrations/shopify/webhooks`).

name = "PorterChain"
client_id = ""
application_url = "https://merchant.porterchain.com/api"
embedded = false

[access_scopes]
scopes = "read_orders,write_fulfillments,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_assigned_fulfillment_orders"

[auth]
redirect_urls = [ "https://api.porterchain.com/v1/integrations/shopify/callback" ]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://api.porterchain.com/v1/integrations/shopify/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://api.porterchain.com/v1/integrations/shopify/webhooks"
