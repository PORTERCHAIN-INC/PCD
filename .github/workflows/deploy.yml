          retry_smoke "website /en" http_code_is https://porterchain.com/en 200
          retry_smoke "sitemap" body_has https://porterchain.com/sitemap.xml '<urlset\|<sitemapindex'
          retry_smoke "trade-van page" http_code_is https://porterchain.com/en/toronto/trade-van-delivery 200
          echo "Website prod smoke passed"

      - name: Prod merchant smoke
        if: needs.plan.outputs.pin_merchant == 'true' && needs.plan.outputs.rollout == 'partial' && steps.deploy-partial.outcome == 'success'
        run: |
