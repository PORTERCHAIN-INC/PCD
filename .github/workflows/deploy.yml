name: Deploy

# Continuous deployment for the Porterchain platform (website, API, portals).
# Runs only after the CI workflow succeeds on `main`, builds a Docker image,
# pushes it to GHCR, then deploys it to the Digital Ocean droplet over SSH.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-website
  API_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-api
  ADMIN_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-admin
  MERCHANT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-merchant
  DRIVER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-driver
  CUSTOMER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-customer
  CONTAINER_NAME: pcd-website
  PROD_API_URL: https://api.porterchain.com
  PROD_SITE_URL: https://porterchain.com

jobs:
  deploy:
    name: Build & deploy Porterchain stack
    runs-on: ubuntu-latest
    # Skip when triggered by a failed CI run (manual dispatch always runs).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check deploy secrets are configured
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets not configured (DEPLOY_HOST missing). Skipping deploy. See infrastructure/deploy/README.md."
          fi

      - name: Resolve commit to deploy
        if: steps.check.outputs.ready == 'true'
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push website image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.value }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://porterchain.com' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:latest
            ${{ env.API_IMAGE_NAME }}:${{ steps.sha.outputs.value }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push admin image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.ADMIN_IMAGE_NAME }}:latest
            ${{ env.ADMIN_IMAGE_NAME }}:${{ steps.sha.outputs.value }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://admin.porterchain.com
            NEXT_PUBLIC_PORTERCHAIN_API_URL=${{ env.PROD_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Build and push merchant image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/merchant-portal/Dockerfile
          push: true
          tags: |
            ${{ env.MERCHANT_IMAGE_NAME }}:latest
            ${{ env.MERCHANT_IMAGE_NAME }}:${{ steps.sha.outputs.value }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://merchant.porterchain.com
            NEXT_PUBLIC_PORTERCHAIN_API_URL=${{ env.PROD_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha,scope=merchant
          cache-to: type=gha,mode=max,scope=merchant

      - name: Build and push driver portal image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/driver-portal/Dockerfile
          push: true
          tags: |
            ${{ env.DRIVER_IMAGE_NAME }}:latest
            ${{ env.DRIVER_IMAGE_NAME }}:${{ steps.sha.outputs.value }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://driver.porterchain.com
            NEXT_PUBLIC_PORTERCHAIN_API_URL=${{ env.PROD_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha,scope=driver
          cache-to: type=gha,mode=max,scope=driver

      - name: Build and push customer portal image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/customer/Dockerfile
          push: true
          tags: |
            ${{ env.CUSTOMER_IMAGE_NAME }}:latest
            ${{ env.CUSTOMER_IMAGE_NAME }}:${{ steps.sha.outputs.value }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://customer.porterchain.com
            NEXT_PUBLIC_PORTERCHAIN_API_URL=${{ env.PROD_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_WEBSITE_URL=${{ env.PROD_SITE_URL }}
          cache-from: type=gha,scope=customer
          cache-to: type=gha,mode=max,scope=customer

      - name: Copy deploy manifests to droplet
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "infrastructure/deploy/docker-compose.prod.yml,infrastructure/deploy/Caddyfile"
          target: "/opt/porterchain"
          strip_components: 2

      - name: Deploy to droplet over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_NAME,API_IMAGE_NAME,ADMIN_IMAGE_NAME,MERCHANT_IMAGE_NAME,DRIVER_IMAGE_NAME,CUSTOMER_IMAGE_NAME,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,GOOGLE_MAPS_SERVER_API_KEY,POSTGRES_PASSWORD,CLERK_SECRET_KEY,CLERK_PUBLISHABLE_KEY,CLERK_JWKS_URL,STRIPE_SECRET,STRIPE_WEBHOOK_SECRET,JWT_SECRET,FIREBASE_PROJECT_ID,FIREBASE_CREDENTIALS_JSON,FIREBASE_WEB_VAPID_KEY,PORTERCHAIN_PUSH_ENABLED
          script: |
            set -e
            cd /opt/porterchain
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WEB_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            export API_IMAGE="$API_IMAGE_NAME:$IMAGE_TAG"
            export ADMIN_IMAGE="$ADMIN_IMAGE_NAME:$IMAGE_TAG"
            export MERCHANT_IMAGE="$MERCHANT_IMAGE_NAME:$IMAGE_TAG"
            export DRIVER_IMAGE="$DRIVER_IMAGE_NAME:$IMAGE_TAG"
            export CUSTOMER_IMAGE="$CUSTOMER_IMAGE_NAME:$IMAGE_TAG"
            umask 077
            mkdir -p secrets
            if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
              printf '%s' "$FIREBASE_CREDENTIALS_JSON" > secrets/firebase-service-account.json
              chmod 600 secrets/firebase-service-account.json
            else
              rm -f secrets/firebase-service-account.json
              touch secrets/firebase-service-account.json
              chmod 600 secrets/firebase-service-account.json
            fi
            cat > .env <<EOF
            GOOGLE_MAPS_SERVER_API_KEY=$GOOGLE_MAPS_SERVER_API_KEY
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            CLERK_SECRET_KEY=$CLERK_SECRET_KEY
            CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY
            CLERK_JWKS_URL=$CLERK_JWKS_URL
            STRIPE_SECRET=$STRIPE_SECRET
            STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
            JWT_SECRET=$JWT_SECRET
            CORS_ORIGINS=https://porterchain.com,https://www.porterchain.com,https://admin.porterchain.com,https://merchant.porterchain.com,https://driver.porterchain.com,https://customer.porterchain.com
            FLEETBASE_DISPATCH_BRIDGE=false
            FLEETBASE_SSO_ENABLED=false
            PORTERCHAIN_PUSH_ENABLED=${PORTERCHAIN_PUSH_ENABLED:-false}
            FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
            FIREBASE_WEB_VAPID_KEY=${FIREBASE_WEB_VAPID_KEY:-}
            EOF
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "Waiting for Postgres..."
            for i in $(seq 1 24); do
              if docker exec pcd-postgres pg_isready -U porterchain -d porterchain >/dev/null 2>&1; then
                echo "Postgres ready"
                break
              fi
              sleep 5
            done
            echo "Running Alembic migrations..."
            if ! docker exec -w /app/apps/api -e PYTHONPATH=/app/apps/api/src:/app/apps/api pcd-api python scripts/repair_and_migrate.py; then
              echo "::error::Migration repair failed; aborting deploy before smoke test"
              docker logs --tail 120 pcd-api || true
              docker exec -w /app/apps/api -e PYTHONPATH=/app/apps/api/src pcd-api alembic current || true
              exit 1
            fi
            if ! docker exec pcd-postgres psql -U porterchain -d porterchain -tAc "SELECT to_regclass('public.booking_drafts')" | grep -q booking_drafts; then
              echo "::error::booking_drafts table missing after migrations"
              exit 1
            fi
            docker restart pcd-api
            docker restart pcd-caddy
            docker image prune -f
            echo "Waiting for API health..."
            for i in $(seq 1 18); do
              if docker exec pcd-api curl -fsS http://localhost:8001/health >/dev/null 2>&1; then
                echo "API healthy"
                break
              fi
              sleep 5
            done
            curl -fsS -o /dev/null http://localhost:80 && echo "Caddy responding (HTTP->HTTPS)" || (docker compose -f docker-compose.prod.yml logs --tail 50 caddy; exit 1)
            docker exec pcd-api curl -fsS http://localhost:8001/health && echo " <- API healthy" || (docker logs --tail 80 pcd-api; exit 1)
            echo "Smoke test: booking draft + quote..."
            docker exec pcd-api curl -fsS -X POST http://localhost:8001/v1/booking-drafts \
              -H 'Content-Type: application/json' \
              -d '{"session_id":"deploy-smoke-test"}' >/dev/null \
              && echo " <- booking-drafts OK" \
              || (docker logs --tail 120 pcd-api; exit 1)
            docker exec pcd-api curl -fsS -X POST http://localhost:8001/v1/quotes \
              -H 'Content-Type: application/json' \
              -d '{"pickup":{"formatted":"Deploy Smoke Pickup, Toronto","lat":43.65,"lng":-79.38},"dropoff":{"formatted":"Deploy Smoke Dropoff, Toronto","lat":43.66,"lng":-79.40},"vehicle_class":"cargoVan","scheduled_at":"2026-07-04T12:00:00Z"}' >/dev/null \
              && echo " <- quotes OK" \
              || (docker logs --tail 120 pcd-api; exit 1)
            docker exec pcd-postgres pg_isready -U porterchain -d porterchain && echo " <- Postgres ready" || (docker logs --tail 50 pcd-postgres; exit 1)
        env:
          IMAGE_TAG: ${{ steps.sha.outputs.value }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
          PORTERCHAIN_PUSH_ENABLED: ${{ vars.PORTERCHAIN_PUSH_ENABLED || 'false' }}

      - name: Prod surface smoke (D3 / G1)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -e
          curl -fsS https://api.porterchain.com/health | grep -q '"status":"ok"'
          curl -fsS https://api.porterchain.com/health/ready
          curl -fsS -o /dev/null -w "%{http_code}" https://porterchain.com/en | grep -q 200
          curl -fsS -o /dev/null -w "%{http_code}" https://customer.porterchain.com/sign-in | grep -q 200
          curl -fsS -o /dev/null -w "%{http_code}" https://merchant.porterchain.com/sign-in | grep -q 200
          curl -fsS -o /dev/null -w "%{http_code}" https://admin.porterchain.com/sign-in | grep -q 200
          curl -fsS -X POST https://api.porterchain.com/v1/quotes \
            -H 'Content-Type: application/json' \
            -d '{"pickup":{"formatted":"Deploy Smoke Pickup, Toronto","lat":43.65,"lng":-79.38},"dropoff":{"formatted":"Deploy Smoke Dropoff, Toronto","lat":43.66,"lng":-79.40},"vehicle_class":"cargoVan","scheduled_at":"2026-07-05T18:00:00Z"}' \
            | grep -q quote_id
          echo "Prod D3 smoke passed"
