name: Deploy

# Path-scoped CD. SSOT: infrastructure/deploy/deploy-rules.json
# Resolver: scripts/resolve_deploy_plan.py — do not invent scopes in this file.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, base-code]
  workflow_dispatch:
    inputs:
      scope:
        description: "Deploy scope (auto = only images whose inputs changed)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - portals
          - website
          - api
          - merchant
          - admin
          - driver
          - customer

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/porterchain-inc/pcd-website
  API_IMAGE_NAME: ghcr.io/porterchain-inc/pcd-api
  ADMIN_IMAGE_NAME: ghcr.io/porterchain-inc/pcd-admin
  MERCHANT_IMAGE_NAME: ghcr.io/porterchain-inc/pcd-merchant
  DRIVER_IMAGE_NAME: ghcr.io/porterchain-inc/pcd-driver
  CUSTOMER_IMAGE_NAME: ghcr.io/porterchain-inc/pcd-customer
  PROD_API_URL: https://api.porterchain.com
  PROD_SITE_URL: https://porterchain.com

jobs:
  plan:
    name: Plan deploy
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.sha.outputs.value }}
      scope: ${{ steps.plan.outputs.scope }}
      rollout: ${{ steps.plan.outputs.rollout }}
      migrate: ${{ steps.plan.outputs.migrate }}
      skip: ${{ steps.plan.outputs.skip }}
      build_count: ${{ steps.plan.outputs.build_count }}
      services: ${{ steps.plan.outputs.services }}
      pin_api: ${{ steps.plan.outputs.pin_api }}
      pin_website: ${{ steps.plan.outputs.pin_website }}
      pin_admin: ${{ steps.plan.outputs.pin_admin }}
      pin_merchant: ${{ steps.plan.outputs.pin_merchant }}
      pin_driver: ${{ steps.plan.outputs.pin_driver }}
      pin_customer: ${{ steps.plan.outputs.pin_customer }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check deploy secrets are configured
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets not configured (DEPLOY_HOST missing). Skipping deploy. See infrastructure/deploy/README.md."
          fi

      - name: Resolve commit to deploy
        if: steps.check.outputs.ready == 'true'
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ steps.sha.outputs.value }}
          fetch-depth: 0

      - name: Resolve deploy plan
        if: steps.check.outputs.ready == 'true'
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested="${{ inputs.scope }}"
          else
            requested="auto"
          fi
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > /tmp/deploy-changed.txt
          else
            git ls-files > /tmp/deploy-changed.txt
          fi
          echo "Changed files:"
          head -80 /tmp/deploy-changed.txt
          python3 scripts/resolve_deploy_plan.py \
            --scope "$requested" \
            --changed-files /tmp/deploy-changed.txt \
            --content-ids \
            --github-output >> "$GITHUB_OUTPUT"
          echo "Deploy plan requested=$requested"
          python3 scripts/resolve_deploy_plan.py \
            --scope "$requested" \
            --changed-files /tmp/deploy-changed.txt \
            --content-ids

      # The composite action also checks this. The string has to live in this
      # file: scripts/verify_enterprise_security.py reads deploy.yml only.
      - name: Require Doppler token before image builds
        if: steps.check.outputs.ready == 'true' && steps.plan.outputs.skip != 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::error::DOPPLER_TOKEN is required. Runtime secrets are in Doppler, not GitHub. See docs/SECRETS_MAP.md"
            exit 1
          fi

  build:
    name: Build ${{ matrix.id }}
    needs: plan
    if: ${{ needs.plan.outputs.ready == 'true' && needs.plan.outputs.skip != 'true' && needs.plan.outputs.build_count != '0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.id != '_noop'
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # Preflight only on website-only deploys. Full/parallel builds skip it so
      # pnpm install + Docker do not OOM the same runner (seen as a dead job
      # with missing logs on Build website).
      - uses: pnpm/action-setup@v6
        if: matrix.flavor == 'website' && needs.plan.outputs.scope == 'website'
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        if: matrix.flavor == 'website' && needs.plan.outputs.scope == 'website'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        if: matrix.flavor == 'website' && needs.plan.outputs.scope == 'website'
        with:
          python-version: "3.14.6"

      - name: Website preflight
        if: matrix.flavor == 'website' && needs.plan.outputs.scope == 'website'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm validate:website-seo
          pnpm validate:developer-portal
          # Free disk before Docker on the same runner.
          rm -rf node_modules website/node_modules apps/*/node_modules packages/*/node_modules || true

      - name: Set up Docker Buildx
        if: matrix.id != '_noop'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: matrix.id != '_noop'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse existing content digest
        if: matrix.id != '_noop'
        id: reuse
        env:
          IMAGE: ${{ matrix.image }}
          CID: ${{ matrix.cid }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${CID}" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker buildx imagetools inspect "${IMAGE}:cid-${CID}" >/dev/null 2>&1; then
            docker buildx imagetools create \
              --tag "${IMAGE}:${SHA}" \
              --tag "${IMAGE}:latest" \
              --tag "${IMAGE}:cid-${CID}" \
              "${IMAGE}:cid-${CID}"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Reused ${IMAGE}:cid-${CID}"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push API image
        if: matrix.flavor == 'api' && steps.reuse.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ needs.plan.outputs.sha }}
            ${{ matrix.image }}:cid-${{ matrix.cid }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Build and push website image
        if: matrix.flavor == 'website' && steps.reuse.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ needs.plan.outputs.sha }}
            ${{ matrix.image }}:cid-${{ matrix.cid }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://porterchain.com' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.CLERK_ADMIN_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_ZOHO_SALESIQ_ENABLED=${{ vars.NEXT_PUBLIC_ZOHO_SALESIQ_ENABLED || 'false' }}
            NEXT_PUBLIC_ZOHO_SALESIQ_WIDGET_CODE=${{ secrets.NEXT_PUBLIC_ZOHO_SALESIQ_WIDGET_CODE }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_GOOGLE_BUSINESS_PROFILE_URL=${{ vars.NEXT_PUBLIC_GOOGLE_BUSINESS_PROFILE_URL }}
            NEXT_PUBLIC_GOOGLE_BUSINESS_REVIEW_URL=${{ vars.NEXT_PUBLIC_GOOGLE_BUSINESS_REVIEW_URL }}
            NEXT_PUBLIC_CONTACT_PHONE=${{ vars.NEXT_PUBLIC_CONTACT_PHONE || '+16476197951' }}
            NEXT_PUBLIC_MERCHANT_PORTAL_URL=https://merchant.porterchain.com
            NEXT_PUBLIC_ADMIN_PORTAL_URL=https://admin.porterchain.com
            NEXT_PUBLIC_CUSTOMER_PORTAL_URL=https://customer.porterchain.com
            NEXT_PUBLIC_DRIVER_PORTAL_URL=https://driver.porterchain.com
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Build and push portal image
        if: matrix.flavor == 'portal' && steps.reuse.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ needs.plan.outputs.sha }}
            ${{ matrix.image }}:cid-${{ matrix.cid }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ matrix.id == 'admin' && 'https://admin.porterchain.com' || matrix.id == 'merchant' && 'https://merchant.porterchain.com' || matrix.id == 'driver' && 'https://driver.porterchain.com' || 'https://customer.porterchain.com' }}
            NEXT_PUBLIC_PORTERCHAIN_API_URL=${{ env.PROD_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.CLERK_ADMIN_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_WEBSITE_URL=${{ env.PROD_SITE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
            NEXT_PUBLIC_APP_ENV=production
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

  rollout:
    name: Rollout ${{ needs.plan.outputs.scope }}
    needs: [plan, build]
    if: ${{ always() && needs.plan.outputs.ready == 'true' && needs.plan.outputs.skip != 'true' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Download Doppler env (once)
        uses: ./.github/actions/stage-doppler-env
        with:
          doppler_token: ${{ secrets.DOPPLER_TOKEN }}
          doppler_project: ${{ vars.DOPPLER_PROJECT || 'pcd' }}
          doppler_config: ${{ vars.DOPPLER_CONFIG || 'prd' }}
          require_keys: POSTGRES_PASSWORD
          upload: "false"

      - name: Copy full-stack deploy manifests to droplet
        if: needs.plan.outputs.rollout == 'full'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "infrastructure/deploy/docker-compose.prod.yml,infrastructure/deploy/Caddyfile,infrastructure/deploy/sync-secrets.sh,infrastructure/deploy/scripts/deploy-paths.sh,infrastructure/deploy/scripts/verify-clerk.sh,infrastructure/deploy/scripts/verify-routing.sh,infrastructure/deploy/scripts/recover-prod-stack.sh,infrastructure/deploy/scripts/backup-porterchain-postgres.sh,infrastructure/deploy/scripts/restore-porterchain-postgres.sh,infrastructure/deploy/scripts/snapshot-before-migrate.sh,infrastructure/deploy/scripts/rollback-prod.sh,infrastructure/deploy/scripts/tune-valhalla-ram.sh,infrastructure/deploy/scripts/rebuild-valhalla-gta.sh,infrastructure/docker/scripts/tune-valhalla-json.py,infrastructure/docker/scripts/prepare-valhalla-gta.sh,infrastructure/docker/valhalla/valhalla.gta-ram.json"
          target: "/opt/porterchain"
          strip_components: 2

      - name: Copy partial-stack deploy manifests to droplet
        if: needs.plan.outputs.rollout == 'partial'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "infrastructure/deploy/docker-compose.prod.yml,infrastructure/deploy/Caddyfile,infrastructure/deploy/sync-secrets.sh"
          target: "/opt/porterchain"
          strip_components: 2

      - name: Copy Doppler config to droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "doppler.yaml"
          target: "/opt/porterchain"

      - name: Upload Doppler env to droplet
        uses: ./.github/actions/stage-doppler-env
        with:
          doppler_token: ${{ secrets.DOPPLER_TOKEN }}
          skip_download: "true"
          upload: "true"
          deploy_host: ${{ secrets.DEPLOY_HOST }}
          deploy_user: ${{ secrets.DEPLOY_USER }}
          deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_port: ${{ secrets.DEPLOY_PORT || 22 }}

      - name: Deploy full stack to droplet over SSH
        id: deploy-full
        if: needs.plan.outputs.rollout == 'full'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_NAME,API_IMAGE_NAME,ADMIN_IMAGE_NAME,MERCHANT_IMAGE_NAME,DRIVER_IMAGE_NAME,CUSTOMER_IMAGE_NAME,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DOPPLER_PROJECT,DOPPLER_CONFIG,PORTERCHAIN_PUSH_ENABLED,PORTERCHAIN_PUSH_SEND,API_REPLICAS
          script: |
            set -euo pipefail
            cd /opt/porterchain
            rollback_and_exit() {
              echo "::error::$1"
              if ! CONFIRM_RESTORE=yes bash scripts/rollback-prod.sh; then
                echo "::error::schema rollback failed — dump path is in backups/pre-migrate-latest.manifest"
              fi
              exit 1
            }
            # Bounded retries (6 attempts, ~65s) so a warming container never triggers a DB restore.
            retry_cmd() {
              local attempt=1
              for delay in 5 10 15 15 20 0; do
                if "$@"; then return 0; fi
                [ "$delay" = 0 ] && return 1
                echo "retry $attempt/5 in ${delay}s: $*"
                sleep "$delay"
                attempt=$((attempt + 1))
              done
            }
            bash scripts/snapshot-before-migrate.sh capture-images
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WEB_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            export API_IMAGE="$API_IMAGE_NAME:$IMAGE_TAG"
            export ADMIN_IMAGE="$ADMIN_IMAGE_NAME:$IMAGE_TAG"
            export MERCHANT_IMAGE="$MERCHANT_IMAGE_NAME:$IMAGE_TAG"
            export DRIVER_IMAGE="$DRIVER_IMAGE_NAME:$IMAGE_TAG"
            export CUSTOMER_IMAGE="$CUSTOMER_IMAGE_NAME:$IMAGE_TAG"
            if [ ! -f doppler.env ]; then
              echo "::error::missing /opt/porterchain/doppler.env (SCP step failed)"
              exit 1
            fi
            echo "sync-secrets: doppler.env bytes=$(wc -c < doppler.env)"
            if ! bash sync-secrets.sh 2>&1; then
              echo "::error::sync-secrets.sh failed — see output above"
              exit 1
            fi
            echo "Compose env file ready ($(wc -c < .env) bytes)"
            docker compose -f docker-compose.prod.yml pull \
              postgres redis spicedb-db-init spicedb-migrate spicedb valhalla \
              api worker web admin merchant driver customer caddy
            bash scripts/recover-prod-stack.sh
            if ! bash scripts/snapshot-before-migrate.sh capture-database; then
              CONFIRM_RESTORE=yes bash scripts/rollback-prod.sh backups/pre-migrate-pending.manifest \
                || echo "::error::image pin after a failed pre-migrate dump failed"
              exit 1
            fi
            echo "Running Alembic migrations..."
            if ! docker compose -f docker-compose.prod.yml exec -T -w /app/apps/api \
              -e PYTHONPATH=/app/apps/api/src:/app/apps/api \
              api python scripts/repair_and_migrate.py; then
              docker compose -f docker-compose.prod.yml logs --tail 120 api || true
              docker compose -f docker-compose.prod.yml exec -T -w /app/apps/api \
                -e PYTHONPATH=/app/apps/api/src api alembic current || true
              rollback_and_exit "Migration failed; restored the pre-migrate database and images"
            fi
            if ! docker exec pcd-postgres psql -U porterchain -d porterchain -tAc "SELECT to_regclass('public.booking_drafts')" | grep -q booking_drafts; then
              rollback_and_exit "booking_drafts table missing after migrations"
            fi
            docker compose -f docker-compose.prod.yml restart api
            docker compose -f docker-compose.prod.yml restart caddy
            echo "Waiting for API health..."
            api_healthy=0
            for i in $(seq 1 18); do
              if docker compose -f docker-compose.prod.yml exec -T api curl -fsS http://localhost:8001/health >/dev/null 2>&1; then
                echo "API healthy"
                api_healthy=1
                break
              fi
              sleep 5
            done
            if [ "$api_healthy" != 1 ]; then
              docker compose -f docker-compose.prod.yml logs --tail 80 api || true
              rollback_and_exit "API did not become healthy after migrate"
            fi
            docker image prune -f
            docker ps --format '{{.Image}}' | sort -u > /tmp/pcd-running-images
            repos="$(docker images --format '{{.Repository}}' | grep -E 'ghcr.io/.*/pcd-' | sort -u || true)"
            for repo in $repos; do
              kept_rollback=0
              for tag in $(docker images "$repo" --format '{{.Tag}}'); do
                [ "$tag" = "<none>" ] && continue
                ref="$repo:$tag"
                if grep -qx "$ref" /tmp/pcd-running-images; then
                  continue
                fi
                if [ "$kept_rollback" -eq 0 ]; then
                  kept_rollback=1
                  echo "keep rollback $ref"
                  continue
                fi
                echo "remove old $ref"
                docker rmi "$ref" || true
              done
            done
            rm -f /tmp/pcd-running-images
            retry_cmd curl -fsS -o /dev/null http://localhost:80 && echo "Caddy responding (HTTP->HTTPS)" || (docker compose -f docker-compose.prod.yml logs --tail 50 caddy; exit 1)
            retry_cmd docker compose -f docker-compose.prod.yml exec -T api curl -fsS http://localhost:8001/health && echo " <- API healthy" || (docker compose -f docker-compose.prod.yml logs --tail 80 api; exit 1)
            echo "Smoke test: booking draft + quote..."
            if ! retry_cmd docker compose -f docker-compose.prod.yml exec -T api curl -fsS -X POST http://localhost:8001/v1/booking-drafts \
              -H 'Content-Type: application/json' \
              -d '{"session_id":"deploy-smoke-test"}' >/dev/null; then
              docker compose -f docker-compose.prod.yml logs --tail 120 api || true
              rollback_and_exit "booking-drafts smoke failed after migrate"
            fi
            echo " <- booking-drafts OK"
            if ! retry_cmd docker compose -f docker-compose.prod.yml exec -T api curl -fsS -X POST http://localhost:8001/v1/quotes \
              -H 'Content-Type: application/json' \
              -d '{"pickup":{"formatted":"Deploy Smoke Pickup, Toronto","lat":43.65,"lng":-79.38},"dropoff":{"formatted":"Deploy Smoke Dropoff, Toronto","lat":43.66,"lng":-79.40},"vehicle_class":"cargoVan","booking_mode":"vehicle","scheduled_at":"2026-07-04T12:00:00Z"}' >/dev/null; then
              docker compose -f docker-compose.prod.yml logs --tail 120 api || true
              rollback_and_exit "quotes smoke failed after migrate"
            fi
            echo " <- quotes OK"
            docker exec pcd-postgres pg_isready -U porterchain -d porterchain && echo " <- Postgres ready" || (docker logs --tail 50 pcd-postgres; exit 1)
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTERCHAIN_PUSH_ENABLED: ${{ vars.PORTERCHAIN_PUSH_ENABLED || 'false' }}
          PORTERCHAIN_PUSH_SEND: ${{ vars.PORTERCHAIN_PUSH_SEND || 'false' }}
          API_REPLICAS: ${{ vars.API_REPLICAS || '1' }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT || 'pcd' }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}

      - name: Deploy scoped services to droplet over SSH
        id: deploy-partial
        if: needs.plan.outputs.rollout == 'partial'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_NAME,API_IMAGE_NAME,ADMIN_IMAGE_NAME,MERCHANT_IMAGE_NAME,DRIVER_IMAGE_NAME,CUSTOMER_IMAGE_NAME,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_SCOPE,SERVICES,MIGRATE,PIN_API,PIN_WEBSITE,PIN_ADMIN,PIN_MERCHANT,PIN_DRIVER,PIN_CUSTOMER,API_REPLICAS
          script: |
            set -euo pipefail
            mkdir -p /opt/porterchain
            cd /opt/porterchain
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WEB_IMAGE="$IMAGE_NAME:latest"
            export API_IMAGE="$API_IMAGE_NAME:latest"
            export ADMIN_IMAGE="$ADMIN_IMAGE_NAME:latest"
            export MERCHANT_IMAGE="$MERCHANT_IMAGE_NAME:latest"
            export DRIVER_IMAGE="$DRIVER_IMAGE_NAME:latest"
            export CUSTOMER_IMAGE="$CUSTOMER_IMAGE_NAME:latest"
            [ "$PIN_WEBSITE" = "true" ] && export WEB_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            [ "$PIN_API" = "true" ] && export API_IMAGE="$API_IMAGE_NAME:$IMAGE_TAG"
            [ "$PIN_ADMIN" = "true" ] && export ADMIN_IMAGE="$ADMIN_IMAGE_NAME:$IMAGE_TAG"
            [ "$PIN_MERCHANT" = "true" ] && export MERCHANT_IMAGE="$MERCHANT_IMAGE_NAME:$IMAGE_TAG"
            [ "$PIN_DRIVER" = "true" ] && export DRIVER_IMAGE="$DRIVER_IMAGE_NAME:$IMAGE_TAG"
            [ "$PIN_CUSTOMER" = "true" ] && export CUSTOMER_IMAGE="$CUSTOMER_IMAGE_NAME:$IMAGE_TAG"
            SERVICES="${SERVICES//,/ }"
            if [ -z "$SERVICES" ]; then
              echo "::error::empty SERVICES for partial scope $DEPLOY_SCOPE"
              exit 1
            fi
            if [ ! -f doppler.env ]; then
              echo "::error::missing /opt/porterchain/doppler.env (SCP step failed)"
              exit 1
            fi
            echo "sync-secrets: doppler.env bytes=$(wc -c < doppler.env)"
            if ! bash sync-secrets.sh 2>&1; then
              echo "::error::sync-secrets.sh failed — see output above"
              exit 1
            fi
            echo "Compose env file ready ($(wc -c < .env) bytes)"
            # shellcheck disable=SC2086
            docker compose -f docker-compose.prod.yml pull $SERVICES
            # shellcheck disable=SC2086
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate $SERVICES
            if [ "$MIGRATE" = "true" ]; then
              echo "Running Alembic migrations (partial, migrate=true)..."
              docker compose -f docker-compose.prod.yml exec -T -w /app/apps/api \
                -e PYTHONPATH=/app/apps/api/src:/app/apps/api \
                api python scripts/repair_and_migrate.py
              docker compose -f docker-compose.prod.yml restart api
              for i in $(seq 1 18); do
                if docker compose -f docker-compose.prod.yml exec -T api curl -fsS http://localhost:8001/health >/dev/null 2>&1; then
                  echo "API healthy"
                  break
                fi
                sleep 5
              done
            fi
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null http://localhost:80; then
                echo "Caddy responding"
                break
              fi
              sleep 5
            done
            echo "Scoped deploy ($DEPLOY_SCOPE) updated: $SERVICES"
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SCOPE: ${{ needs.plan.outputs.scope }}
          SERVICES: ${{ needs.plan.outputs.services }}
          MIGRATE: ${{ needs.plan.outputs.migrate }}
          PIN_API: ${{ needs.plan.outputs.pin_api }}
          PIN_WEBSITE: ${{ needs.plan.outputs.pin_website }}
          PIN_ADMIN: ${{ needs.plan.outputs.pin_admin }}
          PIN_MERCHANT: ${{ needs.plan.outputs.pin_merchant }}
          PIN_DRIVER: ${{ needs.plan.outputs.pin_driver }}
          PIN_CUSTOMER: ${{ needs.plan.outputs.pin_customer }}
          API_REPLICAS: ${{ vars.API_REPLICAS || '1' }}

      - name: Prod surface smoke (D3 / G1)
        id: public-smoke
        if: needs.plan.outputs.rollout == 'full' && steps.deploy-full.outcome == 'success'
        run: |
          set -e
          # Bounded retries: 6 attempts over ~65s (5/10/15/15/20s backoff). Containers can
          # answer 502/503 while warming up; a check fails only after all attempts fail.
          retry_smoke() {
            local desc="$1"; shift
            local attempt=1
            for delay in 5 10 15 15 20 0; do
              if "$@"; then return 0; fi
              if [ "$delay" = 0 ]; then
                echo "::error::smoke failed after $attempt attempts: $desc"
                return 1
              fi
              echo "smoke retry $attempt/5 in ${delay}s: $desc"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }
          http_code_is() { curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$1" | grep -qE "^($2)$"; }
          body_has() { curl -fsS --max-time 20 "$1" | grep -q "$2"; }
          quote_ok() {
            curl -fsS --max-time 30 -X POST https://api.porterchain.com/v1/quotes \
              -H 'Content-Type: application/json' \
              -d '{"pickup":{"formatted":"Deploy Smoke Pickup, Toronto","lat":43.65,"lng":-79.38},"dropoff":{"formatted":"Deploy Smoke Dropoff, Toronto","lat":43.66,"lng":-79.40},"vehicle_class":"cargoVan","booking_mode":"vehicle","scheduled_at":"2026-07-05T18:00:00Z"}' \
              | grep -q quote_id
          }
          retry_smoke "api health" body_has https://api.porterchain.com/health '"status":"ok"'
          retry_smoke "api ready" http_code_is https://api.porterchain.com/health/ready 200
          retry_smoke "website /en" http_code_is https://porterchain.com/en 200
          retry_smoke "admin sign-in" http_code_is https://admin.porterchain.com/sign-in 200
          retry_smoke "merchant login" http_code_is https://merchant.porterchain.com/login '200|307|308'
          retry_smoke "customer login" http_code_is https://customer.porterchain.com/login '200|307|308'
          # Retired Fleetbase hosts must 404 (never fall through to marketing).
          retry_smoke "console 404" http_code_is https://console.porterchain.com/ 404
          retry_smoke "fleetbase 404" http_code_is https://fleetbase.porterchain.com/ 404
          retry_smoke "public quote" quote_ok
          echo "Prod D3 smoke passed"

      - name: Roll back pre-migrate snapshot when prod smoke fails
        if: needs.plan.outputs.rollout == 'full' && steps.public-smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/porterchain
            CONFIRM_RESTORE=yes bash scripts/rollback-prod.sh

      - name: Prod website smoke
        if: needs.plan.outputs.pin_website == 'true' && needs.plan.outputs.rollout == 'partial' && steps.deploy-partial.outcome == 'success'
