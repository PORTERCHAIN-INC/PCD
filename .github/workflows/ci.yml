name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'ci-placeholder-key' }}

  api-postgres:
    name: API (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: porterchain
          POSTGRES_PASSWORD: porterchain
          POSTGRES_DB: porterchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porterchain -d porterchain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://porterchain:porterchain@localhost:5432/porterchain
          APP_ENV: local
        run: |
          export PYTHONPATH=src
          alembic upgrade head

      - name: PostgreSQL smoke tests
        env:
          DATABASE_URL: postgresql+psycopg://porterchain:porterchain@localhost:5432/porterchain
          APP_ENV: local
        run: |
          export PYTHONPATH=src
          pytest tests/test_postgres_smoke.py -v

      - name: Module validation script
        env:
          DATABASE_URL: postgresql+psycopg://porterchain:porterchain@localhost:5432/porterchain
          APP_ENV: local
        run: |
          export PYTHONPATH=src
          python scripts/validate_postgres_modules.py
