name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      # Static D2/D3 validators are mostly stdlib; fleetbase lifecycle import needs httpx.
      - name: Install API deps for contract validators
        run: |
          python -m pip install --upgrade pip
          pip install 'httpx>=0.28.1'

      - name: Lockfile freshness (DD-40 · §2.5.8)
        run: pnpm validate:lockfiles

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: D2 contracts (includes engine import guard §0.3.10)
        run: pnpm validate:d2

      - name: D3 Phase 1 matrix (ENG-G3 · §0.4)
        run: pnpm validate:d3

      - name: List pagination guard (§2.5.6 · DD-24)
        run: pnpm validate:pagination

      - name: Router business-logic audit (§3.1.1)
        run: pnpm validate:router-audit

      - name: Architecture boundaries (§3.1.2–3.1.4)
        run: pnpm validate:architecture

      - name: Golden rules (FND-G4 / §5.3.6)
        run: pnpm validate:golden-rules

      - name: Observability + security headers (Appendix B)
        run: pnpm validate:observability

      - name: Notifications + billing depth (Appendix D)
        run: pnpm validate:notifications-billing

      - name: Enterprise security + identity (§11)
        run: pnpm validate:enterprise-security && pnpm validate:enterprise-identity

      - name: Doc governance + Phase 2 scaffolds
        run: pnpm validate:doc-governance && pnpm validate:phase2-scaffold

      - name: Investor + monopoly metrics (§9–§10)
        run: pnpm validate:investor-monopoly && pnpm validate:integration-adapter

      - name: Enterprise SIG + TAM narrative (ENT-G1 · INV-G4)
        run: pnpm validate:enterprise-narrative

      - name: POD media + mobile appendix
        run: pnpm validate:pod-media && pnpm validate:mobile-appendix

      - name: Mobile Maestro smoke structure (§2.1.10)
        run: pnpm validate:mobile-smoke && pnpm validate:mobile-design

      - name: Portal UX empty states + skeletons (§6.3.2–6.3.3)
        run: pnpm validate:portal-ux

      - name: Tracking maps on retail (§0.6.4)
        run: pnpm validate:tracking-maps

      - name: Admin tablet ops + booking a11y (§6.3.4–6.3.5)
        run: pnpm validate:admin-tablet && pnpm validate:booking-a11y

      - name: Design copy ban-list (§6.1.2 · DES-G2)
        run: pnpm validate:design

      - name: Developer portal (§7.1.6 · §7.1.8)
        run: pnpm validate:developer-portal

      - name: Customer Stripe return URLs (§0.6.5)
        run: pnpm validate:customer-stripe-return

      - name: Product vision baseline (§1.1.1 · §1.1.8 · §1.1.9)
        run: pnpm validate:product-vision

      - name: AI governance (§4.3 · AI-G2/G4)
        run: pnpm validate:ai-governance

      - name: Category positioning (§9.1)
        run: pnpm validate:category-positioning

      - name: Construction site access (§8.1.6)
        run: pnpm validate:construction-site-access

      - name: Moat vertical workflows (§8.1.7 · §8.1.12 · §8.1.2–8.1.9)
        run: pnpm validate:liftgate-pricing && pnpm validate:vertical-onboarding && pnpm validate:medical-food-verticals

      - name: Integration marketplace (§7.2.5)
        run: pnpm validate:integration-marketplace

      - name: Phase 2 feature flags (§1.2.4 · DD-26)
        run: pnpm validate:phase2-flags

      - name: OAuth third-party (§7.1.7)
        run: pnpm validate:oauth

      - name: Build all portals (§0.2.7)
        run: pnpm build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'ci-placeholder-key' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || '' }}

  api-postgres:
    name: API (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine3.24
        env:
          POSTGRES_USER: porterchain
          POSTGRES_PASSWORD: porterchain
          POSTGRES_DB: porterchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porterchain -d porterchain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: API test file count (ENG-G1, DD-01d)
        run: |
          count=$(find tests -name 'test_*.py' | wc -l | tr -d ' ')
          echo "API test files: $count"
          test "$count" -ge 20

      - name: Alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://porterchain:porterchain@localhost:5432/porterchain
          APP_ENV: local
        run: |
          export PYTHONPATH=src:../../shared/python:../../services/python:../../services/fleetbase-adapter:../../services/pricing-engine:../../services/event-bus:../../services/driver-platform
          alembic upgrade head

      - name: API tests (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://porterchain:porterchain@localhost:5432/porterchain
          APP_ENV: local
        run: |
          export PYTHONPATH=src:../../shared/python:../../services/python:../../services/fleetbase-adapter:../../services/pricing-engine:../../services/event-bus:../../services/driver-platform:../../apps/worker
          pip install pytest-cov
          pytest tests/ --cov=porterchain_api --cov-config=.coveragerc --cov-report=json -v

      - name: Service coverage floor (§2.1.11)
        run: python scripts/verify_service_coverage.py

      - name: Test count regression guard (§2.1.12)
        run: python scripts/verify_test_regression.py

      - name: Module validation script
        env:
          DATABASE_URL: postgresql+psycopg://porterchain:porterchain@localhost:5432/porterchain
          APP_ENV: local
        run: |
          export PYTHONPATH=src:../../shared/python:../../services/python:../../services/fleetbase-adapter:../../services/pricing-engine:../../services/event-bus:../../services/driver-platform
          python scripts/validate_postgres_modules.py
