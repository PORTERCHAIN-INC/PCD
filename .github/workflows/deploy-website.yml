name: Deploy Website

# Website-only production deploy (builds web image, recreates `web` service on droplet).
on:
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-website
  API_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-api
  ADMIN_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-admin
  MERCHANT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-merchant
  DRIVER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-driver
  CUSTOMER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pcd-customer
  PROD_SITE_URL: https://porterchain.com

jobs:
  deploy-website:
    name: Build & deploy website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check deploy secrets are configured
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets not configured (DEPLOY_HOST missing). Skipping deploy."
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'

      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        if: steps.check.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Website SEO validation
        if: steps.check.outputs.ready == 'true'
        run: pnpm validate:website-seo

      - name: Developer portal validation
        if: steps.check.outputs.ready == 'true'
        run: pnpm validate:developer-portal

      - name: Website lint
        if: steps.check.outputs.ready == 'true'
        run: pnpm --filter @porterchain/website lint

      - name: Format check (website)
        if: steps.check.outputs.ready == 'true'
        run: pnpm exec prettier --check "website/src/**/*.{ts,tsx}"

      - name: Dependency audit (advisory)
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: pnpm audit --prod

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push website image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://porterchain.com' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.CLERK_ADMIN_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_ZOHO_SALESIQ_ENABLED=${{ vars.NEXT_PUBLIC_ZOHO_SALESIQ_ENABLED || 'false' }}
            NEXT_PUBLIC_ZOHO_SALESIQ_WIDGET_CODE=${{ secrets.NEXT_PUBLIC_ZOHO_SALESIQ_WIDGET_CODE }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_GOOGLE_BUSINESS_PROFILE_URL=${{ vars.NEXT_PUBLIC_GOOGLE_BUSINESS_PROFILE_URL }}
            NEXT_PUBLIC_GOOGLE_BUSINESS_REVIEW_URL=${{ vars.NEXT_PUBLIC_GOOGLE_BUSINESS_REVIEW_URL }}
            NEXT_PUBLIC_CONTACT_PHONE=${{ vars.NEXT_PUBLIC_CONTACT_PHONE || '+16476197951' }}
            NEXT_PUBLIC_MERCHANT_PORTAL_URL=https://merchant.porterchain.com
            NEXT_PUBLIC_ADMIN_PORTAL_URL=https://admin.porterchain.com
            NEXT_PUBLIC_CUSTOMER_PORTAL_URL=https://customer.porterchain.com
            NEXT_PUBLIC_DRIVER_PORTAL_URL=https://driver.porterchain.com
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

      - name: Copy deploy manifests to droplet
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "infrastructure/deploy/docker-compose.prod.yml,infrastructure/deploy/Caddyfile,infrastructure/deploy/sync-secrets.sh,infrastructure/deploy/scripts/recover-prod-stack.sh"
          target: "/opt/porterchain"
          strip_components: 2

      - name: Copy Doppler config to droplet
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "doppler.yaml"
          target: "/opt/porterchain"

      - name: Stage Doppler token for droplet
        if: steps.check.outputs.ready == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT || 'pcd' }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::error::DOPPLER_TOKEN is required. Runtime secrets are in Doppler, not GitHub."
            exit 1
          fi
          umask 077
          printf '%s' "$DOPPLER_TOKEN" > .doppler_token
          code="$(curl -sS -o /tmp/doppler-preflight.json -w '%{http_code}' \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            "https://api.doppler.com/v3/configs/config/secret?project=${DOPPLER_PROJECT}&config=${DOPPLER_CONFIG}&name=POSTGRES_PASSWORD")"
          if [ "$code" != "200" ]; then
            echo "::error::DOPPLER_TOKEN cannot read ${DOPPLER_PROJECT}/${DOPPLER_CONFIG} (HTTP ${code}). Rotate via: gh secret set DOPPLER_TOKEN"
            head -c 400 /tmp/doppler-preflight.json || true
            echo
            exit 1
          fi
          echo "Doppler preflight OK"

      - name: Copy Doppler token to droplet
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: ".doppler_token"
          target: "/opt/porterchain"

      - name: Deploy website to droplet over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_NAME,API_IMAGE_NAME,ADMIN_IMAGE_NAME,MERCHANT_IMAGE_NAME,DRIVER_IMAGE_NAME,CUSTOMER_IMAGE_NAME,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DOPPLER_TOKEN,DOPPLER_PROJECT,DOPPLER_CONFIG,API_REPLICAS
          script: |
            set -euo pipefail
            mkdir -p /opt/porterchain
            cd /opt/porterchain
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WEB_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            export API_IMAGE="$API_IMAGE_NAME:latest"
            export ADMIN_IMAGE="$ADMIN_IMAGE_NAME:latest"
            export MERCHANT_IMAGE="$MERCHANT_IMAGE_NAME:latest"
            export DRIVER_IMAGE="$DRIVER_IMAGE_NAME:latest"
            export CUSTOMER_IMAGE="$CUSTOMER_IMAGE_NAME:latest"
            echo "sync-secrets: DOPPLER_TOKEN_len=${#DOPPLER_TOKEN} token_file=$([ -f .doppler_token ] && echo yes || echo no)"
            if ! bash sync-secrets.sh 2>&1; then
              echo "::error::sync-secrets.sh failed — see output above"
              exit 1
            fi
            echo "Compose env file ready ($(wc -c < .env) bytes)"
            docker compose -f docker-compose.prod.yml pull web api admin merchant driver customer worker caddy
            bash scripts/recover-prod-stack.sh
            for i in $(seq 1 18); do
              if curl -fsS -o /dev/null http://localhost:80; then
                echo "Caddy responding"
                break
              fi
              sleep 5
            done
            echo "Stack updated with website image $WEB_IMAGE"
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT || 'pcd' }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}
          API_REPLICAS: ${{ vars.API_REPLICAS || '2' }}

      - name: Prod website smoke
        if: steps.check.outputs.ready == 'true'
        run: |
          set -e
          curl -fsS -o /dev/null -w "%{http_code}" https://porterchain.com/en | grep -q 200
          curl -fsS https://porterchain.com/sitemap.xml | grep -q '<urlset'
          curl -fsS -o /dev/null -w "%{http_code}" https://porterchain.com/en/toronto/trade-van-delivery | grep -q 200
          echo "Website prod smoke passed"
