name: Set Public Ingest Key

# One-shot ops: ensure PUBLIC_INGEST_API_KEY exists in Doppler and roll api + website.
# Contact / quote forms POST /api/inquiries → API /v1/public/inquiries → admin CRM leads.
# Secrets path matches Deploy: ./.github/actions/stage-doppler-env (runner download → SCP).
on:
  workflow_dispatch:

concurrency:
  group: set-ingest-key
  cancel-in-progress: false

jobs:
  ensure-ingest-key:
    name: Doppler + droplet roll
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check deploy secrets are configured
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::DEPLOY_HOST missing — cannot roll droplet. See infrastructure/deploy/README.md"
            exit 1
          fi

      - name: Install Doppler CLI
        run: curl -sLf --retry 3 https://cli.doppler.com/install.sh | sh

      - name: Ensure PUBLIC_INGEST_API_KEY in Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT || 'pcd' }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN is required"
            exit 1
          fi
          existing="$(doppler secrets get PUBLIC_INGEST_API_KEY --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" --plain 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "PUBLIC_INGEST_API_KEY already present in Doppler (not rotated)."
          else
            key="$(openssl rand -hex 32)"
            echo "::add-mask::$key"
            doppler secrets set "PUBLIC_INGEST_API_KEY=${key}" --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG"
            echo "Uploaded new PUBLIC_INGEST_API_KEY to Doppler ${DOPPLER_PROJECT}/${DOPPLER_CONFIG}."
          fi

      # Cold-droplet safety: sync-secrets.sh must exist before SSH roll.
      - name: Copy sync-secrets.sh to droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "infrastructure/deploy/sync-secrets.sh"
          target: "/opt/porterchain"
          strip_components: 2

      - name: Download + upload Doppler env
        uses: ./.github/actions/stage-doppler-env
        with:
          doppler_token: ${{ secrets.DOPPLER_TOKEN }}
          doppler_project: ${{ vars.DOPPLER_PROJECT || 'pcd' }}
          doppler_config: ${{ vars.DOPPLER_CONFIG || 'prd' }}
          require_keys: POSTGRES_PASSWORD,PUBLIC_INGEST_API_KEY
          upload: "true"
          deploy_host: ${{ secrets.DEPLOY_HOST }}
          deploy_user: ${{ secrets.DEPLOY_USER }}
          deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_port: ${{ secrets.DEPLOY_PORT || 22 }}

      - name: Sync secrets and recreate api + web
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/porterchain
            if [ ! -f sync-secrets.sh ]; then
              echo "::error::missing /opt/porterchain/sync-secrets.sh"
              exit 1
            fi
            if [ ! -f doppler.env ]; then
              echo "::error::missing /opt/porterchain/doppler.env (SCP step failed)"
              exit 1
            fi
            bash sync-secrets.sh
            if ! grep -qE '^PUBLIC_INGEST_API_KEY=.+' .env; then
              echo "::error::PUBLIC_INGEST_API_KEY missing from synced .env"
              exit 1
            fi
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps api web
            sleep 8
            docker compose -f docker-compose.prod.yml exec -T api curl -fsS http://localhost:8001/health
            echo "api + web recreated with ingest key"
