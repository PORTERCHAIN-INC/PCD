name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Bandit
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r src/porterchain_api \
            -x '*/tests/*,*/alembic/*' \
            -ll \
            --format json -o bandit-report.json || true
          bandit -r src/porterchain_api \
            -x '*/tests/*,*/alembic/*' \
            -ll

  trivy:
    name: Trivy (containers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: website
            dockerfile: website/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        run: |
          docker build -f ${{ matrix.dockerfile }} -t pcd-scan:${{ matrix.name }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pcd-scan:${{ matrix.name }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
