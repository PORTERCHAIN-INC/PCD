name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Bandit
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r src/porterchain_api -c .bandit -ll --format json -o bandit-report.json || true
          bandit -r src/porterchain_api -c .bandit -ll

  trivy:
    name: Trivy (containers)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: website
            dockerfile: website/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Build image for scan
        run: |
          docker build -f ${{ matrix.dockerfile }} -t pcd-scan:${{ matrix.name }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pcd-scan:${{ matrix.name }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
