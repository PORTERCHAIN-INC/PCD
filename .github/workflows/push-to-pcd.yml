name: Push to porterchain/PCD

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to push to porterchain/PCD"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - feature/crm
      commit_message:
        description: "Commit message for the push"
        required: true
        default: "chore: auto-push from local repository"

permissions:
  contents: write

jobs:
  push-to-pcd:
    name: Push changes to porterchain/PCD
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Verify remote repository
        run: |
          echo "Remote repository: ${{ github.repository }}"
          git remote -v

      - name: Push to porterchain/PCD
        run: |
          # Fetch all branches to ensure we have latest state
          git fetch origin

          # Push the current branch to the porterchain/PCD remote
          git push origin ${{ inputs.branch }} --follow-tags

          echo "Successfully pushed to porterchain/PCD on branch ${{ inputs.branch }}"

      - name: Verify push success
        run: |
          echo "Verifying push..."
          git log --oneline -5
          echo "Push verification complete"
