# Porterchain integrations reference
# See INTEGRATIONS.md for full documentation.

integrations:
  google_maps:
    status: implemented
    package: "@vis.gl/react-google-maps@1.8.3"
    env:
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      - GOOGLE_MAPS_SERVER_API_KEY
    code:
      - website/src/lib/maps.ts
      - website/src/lib/env.ts
      - website/src/components/maps/

  porterchain_api:
    status: planned
    env:
      - NEXT_PUBLIC_PORTERCHAIN_API_URL
    default_port: 8001

  supabase_booking_otp:
    status: planned
    env:
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY

  fleetbase:
    status: external
    env_template: env/fleetbase.env.example
    ports:
      api: 8000
      console: 4200

  stripe:
    status: external
    env_template: env/api.env.example
    note: Server-only — never in website .env

  clerk:
    status: external
    env_template: env/merchant-portal.env.example

  valhalla:
    status: docker
    profile: routing
    port: 8002

  osrm:
    status: fallback
    env: OSRM_HOST

  twilio:
    status: external
    env_template: env/api.env.example

  firebase_fcm:
    status: external
    note: API-side only; driver app does not use Firebase
