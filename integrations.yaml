# Porterchain integrations reference
# Canonical matrix: INTEGRATIONS.md · verified by pnpm validate:integrations-matrix

integrations:
  porterchain_api:
    status: implemented
    env:
      - NEXT_PUBLIC_PORTERCHAIN_API_URL
    default_port: 8001
    code:
      - apps/api/src/porterchain_api/

  postgres:
    status: implemented
    version: "18"
    code:
      - apps/api/src/porterchain_api/db.py
      - infrastructure/docker/docker-compose.yml

  redis:
    status: implemented
    version: "8.8"
    code:
      - shared/python/porterchain_shared/redis_client.py

  mailpit:
    status: implemented
    note: Dev SMTP — not Mailhog

  dispatch:
    status: implemented
    note: PorterChain day plan — OR-Tools in dispatch_engine, Valhalla road cost, Redis GPS
    code:
      - apps/api/src/porterchain_api/dispatch_engine/

  google_maps:
    status: implemented
    package: "@vis.gl/react-google-maps@1.8.3"
    env:
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      - GOOGLE_MAPS_SERVER_API_KEY
    code:
      - website/src/lib/maps.ts
      - packages/maps/

  valhalla:
    status: docker
    profile: routing
    port: 8002
    code:
      - services/pricing-engine/

  osrm:
    status: docker
    profile: routing
    port: 5000
    note: GTA ±150 km fallback — same PBF as Valhalla; not router.project-osrm.org
    env: OSRM_HOST
    code:
      - services/python/porterchain_services/maps/service.py
      - infrastructure/docker/docker-compose.yml

  stripe:
    status: external
    env_template: env/api.env.example
    note: Server-only — frozen config

  clerk:
    status: external
    env_template: env/clerk.env
    note: Sole authentication provider

  firebase_fcm:
    status: partial
    note: mobile-driver FCM token; prod credentials required

  smtp:
    status: implemented
    env:
      - MAIL_HOST
      - SMTP_HOST

  merchant_api_keys:
    status: implemented
    code:
      - apps/api/src/porterchain_api/auth/merchant_api.py
      - apps/api/src/porterchain_api/routers/merchant_api.py

  merchant_webhooks:
    status: implemented
    code:
      - apps/api/src/porterchain_api/merchant_engine/webhook_delivery_service.py

  oauth_third_party:
    status: implemented
    code:
      - apps/api/src/porterchain_api/routers/oauth.py
      - apps/api/src/porterchain_api/oauth_engine/

  zoho_salesiq:
    status: optional
    code:
      - website/src/components/integrations/ZohoSalesIQ.tsx

  shopify:
    status: planned
    note: Merchant API + webhooks — native app deferred (§7.2.1 skipped)

  woocommerce:
    status: planned
    note: REST hooks + CSV — connector deferred (§7.2.2)
