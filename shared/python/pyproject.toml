[project]
name = "porterchain-shared"
version = "0.1.0"
description = "Porterchain shared platform primitives (auth, events, queues, config)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["porterchain_shared"]
