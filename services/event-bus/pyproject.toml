[project]
name = "porterchain-event-bus"
version = "0.1.0"
description = "Porterchain centralized event bus — publish, subscribe, retry, DLQ"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["porterchain_event_bus"]
