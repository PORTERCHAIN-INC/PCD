# Porterchain overlay for Fleetbase Docker Compose
# Does NOT modify upstream docker-compose.yml — merged via:
#   docker compose -f apps/fleetbase/docker-compose.yml \
#     -f apps/fleetbase/docker-compose.override.yml \
#     -f infrastructure/docker/fleetbase.porterchain.override.yml
#
# Runtime SSOT (P0-1): digest-pin fleetbase-api — never :latest.
# Baked packages in this digest: fleetops-api 0.6.59, core-api 1.6.55
# (host apps/fleetbase @ v0.7.40 composer.lock may still list 0.6.48/1.6.47 —
#  the running image vendor tree is authoritative for API contracts).
# See FLEETBASE_INSTALL.md and DOCKER_SETUP.md

name: porterchain-fleetbase

# Pin verified 2026-08-07 from local pc-application-1 (fleetops-api 0.6.59).
x-fleetbase-api-image: &fleetbase_api_image fleetbase/fleetbase-api@sha256:24c0fbe5e465e3876c74836e619d08968d8a2ca1cba400fd67290601141799a5

services:
  database:
    container_name: porterchain-fleetbase-mysql
    ports: !override
      - "127.0.0.1:3307:3306"
    volumes:
      - fleetbase-mysql-data:/var/lib/mysql
      - ../../apps/fleetbase/docker/database/:/docker-entrypoint-initdb.d/:ro
    networks:
      - fleetbase-internal

  cache:
    # Upstream Fleetbase still declares redis:4-alpine; this override is the supported cache.
    image: valkey/valkey:8.1.8-alpine
    container_name: porterchain-fleetbase-redis
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - fleetbase-redis-data:/data
    networks:
      - fleetbase-internal

  socket:
    image: socketcluster/socketcluster:v17.4.0
    container_name: porterchain-fleetbase-socketcluster
    networks:
      - fleetbase-internal

  scheduler:
    image: *fleetbase_api_image
    container_name: porterchain-fleetbase-scheduler
    networks:
      - fleetbase-internal

  queue:
    image: *fleetbase_api_image
    container_name: porterchain-fleetbase-queue
    networks:
      - fleetbase-internal

  console:
    container_name: porterchain-fleetbase-console
    networks:
      - fleetbase-internal

  application:
    image: *fleetbase_api_image
    container_name: porterchain-fleetbase-application
    volumes:
      - fleetbase-api-storage:/fleetbase/api/storage/app
    environment:
      APP_NAME: "Porterchain Fleetbase"
      OSRM_HOST: https://router.project-osrm.org
      ROUTING_ENGINE: valhalla
      # Shared PorterChain Valhalla (GTA tiles) — same engine as pricing, not the public demo
      VALHALLA_BASE_URL: http://host.docker.internal:8002
      VALHALLA_BASE_URI: http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fleetbase-internal

  httpd:
    container_name: porterchain-fleetbase-httpd
    networks:
      - fleetbase-internal

networks:
  fleetbase-internal:
    driver: bridge
  porterchain-bridge:
    external: true
    name: porterchain_porterchain-internal

volumes:
  fleetbase-mysql-data:
    name: porterchain-fleetbase-mysql-data
  fleetbase-redis-data:
    name: porterchain-fleetbase-redis-data
  fleetbase-api-storage:
    name: porterchain-fleetbase-api-storage
