cliArgs:
  geometry: false
  planmode: false
  threads: 2
  explore: 5
  limit: "10mb"
  logdir: "/.."
  logsize: "100M"
  maxlocations: 2000
  maxvehicles: 200
  override: true
  path: ""
  port: 3000
  router: "osrm"
  timeout: 300000
  baseurl: "/"
routingServers:
  osrm:
    car:
      host: "osrm"
      port: "5000"
