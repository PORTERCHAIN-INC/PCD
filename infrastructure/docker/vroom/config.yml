# Fleetbase VROOM sidecar — open-source vroom-express, not Verso SaaS.
# Router is the pinned GTA Valhalla on :8002 (same tiles as PorterChain quotes).
#
# HS-25 / MAP-13: VROOM_ROUTER=valhalla. Valhalla costing names are auto/truck/…
# (NOT "car"). Fleetbase must send VROOM_PROFILE=auto (see fleetbase override).
# The OSRM "car" entry is only a fallback when :5000 is up; Optimize must not
# depend on it (stop OSRM → profile=auto still works).
cliArgs:
  geometry: false
  planmode: false
  threads: 4
  explore: 5
  limit: "1mb"
  logdir: "/conf"
  logsize: "100M"
  maxlocations: 1000
  maxvehicles: 200
  override: ["c", "g", "l", "t", "x"]
  path: ""
  port: 3000
  router: "valhalla"
  timeout: 300000
  baseurl: "/"
routingServers:
  osrm:
    car:
      host: "host.docker.internal"
      port: "5000"
  valhalla:
    # Do not list "car" here — Valhalla rejects costing=car.
    auto:
      host: "host.docker.internal"
      port: "8002"
    bicycle:
      host: "host.docker.internal"
      port: "8002"
    pedestrian:
      host: "host.docker.internal"
      port: "8002"
    motorcycle:
      host: "host.docker.internal"
      port: "8002"
    motor_scooter:
      host: "host.docker.internal"
      port: "8002"
    taxi:
      host: "host.docker.internal"
      port: "8002"
    hov:
      host: "host.docker.internal"
      port: "8002"
    truck:
      host: "host.docker.internal"
      port: "8002"
    bus:
      host: "host.docker.internal"
      port: "8002"
