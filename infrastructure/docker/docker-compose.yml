# Porterchain local infrastructure
# Image policy: exact tags or digests only — no :latest / floating minors (see .cursor/rules/dependency-freeze.mdc).
# Usage:
#   cp .env.example .env   # fill secrets
#   docker compose --profile core up -d
#   docker compose --profile core --profile routing up -d
#
# Profiles:
#   core     — PostgreSQL, Redis, Mailpit (always safe to start for PorterChain)
#   routing  — Valhalla (large image; first start downloads tiles)
#   fleetbase — MySQL + Fleetbase API + console (requires Fleetbase images)
#   proxy    — Nginx dev proxy

name: porterchain

services:
  # Fleetbase services require MySQL (see line 19) — do NOT remove.
  # PorterChain API uses PostgreSQL only (line 72).
  database:
    profiles: [core, fleetbase]
    image: mysql:8.0.46
    container_name: porterchain-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fleetbase}
      MYSQL_USER: ${MYSQL_USER:-fleetbase}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-fleetbase}
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=50", "--performance-schema=OFF"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - porterchain-data
      - porterchain-internal
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-change-me-root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    profiles: [core, fleetbase]
    image: redis:8.8.0-alpine3.23
    container_name: porterchain-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - porterchain-data
      - porterchain-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    profiles: [core]
    image: postgres:18-alpine3.24
    container_name: porterchain-postgres
    restart: unless-stopped
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "work_mem=4MB",
        "-c",
        "effective_cache_size=256MB",
        "-c",
        "maintenance_work_mem=32MB",
      ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porterchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porterchain}
      POSTGRES_DB: ${POSTGRES_DB:-porterchain}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-spicedb.sql:/docker-entrypoint-initdb.d/02-spicedb.sql:ro
    networks:
      - porterchain-data
      - porterchain-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-porterchain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  spicedb-migrate:
    profiles: [core]
    image: authzed/spicedb:v1.56.0
    container_name: porterchain-spicedb-migrate
    command: ["migrate", "head"]
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${POSTGRES_USER:-porterchain}:${POSTGRES_PASSWORD:-porterchain}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - porterchain-data
      - porterchain-internal
    restart: "no"

  spicedb:
    profiles: [core]
    image: authzed/spicedb:v1.56.0
    container_name: porterchain-spicedb
    restart: unless-stopped
    command:
      [
        "serve",
        "--grpc-preshared-key",
        "${SPICEDB_PRESHARED_KEY:-porterchain-spicedb-dev-key}",
        "--datastore-engine",
        "postgres",
        "--datastore-conn-uri",
        "postgres://${POSTGRES_USER:-porterchain}:${POSTGRES_PASSWORD:-porterchain}@postgres:5432/spicedb?sslmode=disable",
        "--http-enabled",
      ]
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
    networks:
      - porterchain-data
      - porterchain-internal
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailpit:
    profiles: [core]
    image: axllent/mailpit:v1.30.3
    container_name: porterchain-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - porterchain-internal

  valhalla:
    profiles: [routing]
    image: ghcr.io/valhalla/valhalla-scripted@sha256:9ba06c00f41fabec8d3cb2e7ec3c39023be7a410d245049d76af3b494e1ce674
    container_name: porterchain-valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      # Local GTA ~150 km extract only (see scripts/prepare-valhalla-gta.sh) — not full Ontario
      - ./valhalla/data:/custom_files
    environment:
      # Build from bind-mounted gta-150km.osm.pbf only (prepare-valhalla-gta.sh). No Ontario URL.
      tile_urls: ""
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      # Admins need planet-scale extract; skip for GTA clip
      build_admins: "False"
      build_time_zones: "False"
      server_threads: "1"
    networks:
      - porterchain-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Fleetbase images — enable when images are available in your registry.
  # fleetbase-api:
  #   profiles: [fleetbase]
  #   image: fleetbase/api:latest
  #   container_name: porterchain-fleetbase-api
  #   restart: unless-stopped
  #   env_file:
  #     - ../../env/fleetbase.env.example
  #   ports:
  #     - "127.0.0.1:8000:8000"
  #   depends_on:
  #     database:
  #       condition: service_healthy
  #     cache:
  #       condition: service_healthy
  #   volumes:
  #     - fleetbase-storage:/fleetbase/api/storage
  #   networks:
  #     - porterchain-internal

  # fleetbase-console:
  #   profiles: [fleetbase]
  #   image: fleetbase/console:latest
  #   container_name: porterchain-console
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:4200:4200"
  #   depends_on:
  #     - fleetbase-api
  #   networks:
  #     - porterchain-internal

  proxy:
    profiles: [proxy]
    image: nginx:1.31-alpine3.23
    container_name: porterchain-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - porterchain-internal

networks:
  porterchain-internal:
    driver: bridge
  porterchain-data:
    driver: bridge
    internal: true

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  mailpit-data:
  fleetbase-storage:
  api-storage:
