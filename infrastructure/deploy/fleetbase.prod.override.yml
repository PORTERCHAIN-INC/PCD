# Production Fleetbase overlay — joins PorterChain edge network for Caddy + Valhalla.
# Used on droplet with:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f /opt/porterchain/fleetbase.prod.override.yml up -d
#
# Does not modify upstream Fleetbase source.

name: porterchain-fleetbase

x-fleetbase-api-image: &fleetbase_api_image fleetbase/fleetbase-api@sha256:24c0fbe5e465e3876c74836e619d08968d8a2ca1cba400fd67290601141799a5

services:
  database:
    container_name: porterchain-fleetbase-mysql
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=50", "--performance-schema=OFF"]
    ports: !override
      - "127.0.0.1:3307:3306"
    networks:
      - fleetbase-internal

  cache:
    image: valkey/valkey:8.1.8-alpine
    container_name: porterchain-fleetbase-redis
    command: valkey-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fleetbase-internal

  socket:
    image: socketcluster/socketcluster:v17.4.0
    container_name: porterchain-fleetbase-socketcluster
    ports: !override []
    environment:
      SOCKETCLUSTER_WORKERS: "1"
      SOCKETCLUSTER_BROKERS: "1"
      SOCKETCLUSTER_OPTIONS: '{"origins":"https://console.porterchain.com:*,https://fleetbase.porterchain.com:*,wss://console.porterchain.com:*,wss://fleetbase.porterchain.com:*"}'
    networks:
      - fleetbase-internal
      - edge

  scheduler:
    image: *fleetbase_api_image
    container_name: porterchain-fleetbase-scheduler
    networks:
      - fleetbase-internal

  queue:
    image: *fleetbase_api_image
    container_name: porterchain-fleetbase-queue
    networks:
      - fleetbase-internal

  console:
    container_name: porterchain-fleetbase-console
    ports: !override []
    networks:
      - fleetbase-internal
      - edge

  application:
    image: *fleetbase_api_image
    container_name: porterchain-fleetbase-application
    environment:
      APP_NAME: "Porterchain Fleetbase"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://console.porterchain.com
      CONSOLE_HOST: https://console.porterchain.com
      ENVIRONMENT: production
      SESSION_DOMAIN: console.porterchain.com
      OSRM_HOST: https://router.project-osrm.org
      ROUTING_ENGINE: valhalla
      VALHALLA_BASE_URL: http://pcd-valhalla:8002
      VALHALLA_BASE_URI: http://pcd-valhalla:8002
      PORTERCHAIN_API_URL: http://api:8001
      PORTERCHAIN_FLEETBASE_DISPATCH_BRIDGE: "true"
      PORTERCHAIN_SSO_JWT_SECRET: ${PORTERCHAIN_SSO_JWT_SECRET:-}
      PORTERCHAIN_FLEETBASE_DEFAULT_COMPANY_UUID: ${PORTERCHAIN_FLEETBASE_DEFAULT_COMPANY_UUID:-}
    volumes:
      - /opt/porterchain/packages/porterchain-bridge:/fleetbase/api/packages/porterchain-bridge:ro
      - /opt/porterchain/packages/porterchain-bridge/docker/RouteServiceProvider.php:/fleetbase/api/app/Providers/RouteServiceProvider.php:ro
    networks:
      - fleetbase-internal
      - edge

  httpd:
    container_name: porterchain-fleetbase-httpd
    ports: !override []
    networks:
      - fleetbase-internal
      - edge

networks:
  fleetbase-internal:
    driver: bridge
  edge:
    external: true
    name: porterchain-prod_edge

volumes:
  fleetbase-mysql-data:
    name: porterchain-fleetbase-mysql-data
  fleetbase-redis-data:
    name: porterchain-fleetbase-redis-data
  fleetbase-api-storage:
    name: porterchain-fleetbase-api-storage
