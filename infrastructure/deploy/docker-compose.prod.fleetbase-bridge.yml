# Apply on the PorterChain API/worker compose (not the Fleetbase compose).
# Fleetbase.prod.override.yml cannot set env on pcd-api — it is a different project.
#
#   docker compose -f docker-compose.prod.yml \
#     -f docker-compose.prod.fleetbase-bridge.yml up -d api worker
#
# Requires FLEETBASE_API_KEY, FLEETBASE_WEBHOOK_SECRET, and
# FLEETBASE_DEFAULT_COMPANY_UUID (API refuses to boot in production without them).

services:
  api:
    environment:
      FLEETBASE_DISPATCH_BRIDGE: ${FLEETBASE_DISPATCH_BRIDGE:-true}
  worker:
    environment:
      FLEETBASE_DISPATCH_BRIDGE: ${FLEETBASE_DISPATCH_BRIDGE:-true}
