<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>PorterChain · Dispatch console</title>
    <style>
      :root {
        --primary: #0b1220;
        --secondary: #2563eb;
        --muted: #64748b;
        --line: #e2e8f0;
        --bg: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: Calibri, Carlito, Candara, "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: min(28rem, 100%);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 2rem 1.75rem 1.75rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: 0.85rem;
      }
      h1 {
        margin: 1rem 0 0.35rem;
        font-size: 1.25rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.55;
      }
      a.btn {
        display: inline-block;
        margin-top: 1.35rem;
        background: var(--secondary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.7rem 1.15rem;
        border-radius: 10px;
      }
      a.btn:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">PC</div>
      <h1>Dispatch console</h1>
      <p>
        Sign in from PorterChain Admin. The execution console uses your staff session — there is no
        separate Fleetbase password.
      </p>
      <a class="btn" href="https://admin.porterchain.com">Continue to Admin</a>
    </main>
  </body>
</html>
