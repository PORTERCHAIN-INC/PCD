# SSO overlay for the official Fleetbase installer project (`fleetbase`).
# Does not rename containers. Merge with:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f /opt/porterchain/fleetbase.sso.override.yml up -d
#
# Secrets (PORTERCHAIN_SSO_JWT_SECRET, company UUID) come from /opt/fleetbase/.env
# written by enable-fleetbase-sso-prod.sh — never commit those values.

services:
  application:
    volumes:
      - /opt/porterchain/packages/porterchain-bridge:/fleetbase/api/packages/porterchain-bridge:ro
      - /opt/porterchain/packages/porterchain-bridge/docker/RouteServiceProvider.php:/fleetbase/api/app/Providers/RouteServiceProvider.php:ro
    environment:
      APP_NAME: "PorterChain"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://console.porterchain.com
      CONSOLE_HOST: https://console.porterchain.com
      ENVIRONMENT: production
      SESSION_DOMAIN: console.porterchain.com
      SESSION_SECURE_COOKIE: "true"
      SANCTUM_STATEFUL_DOMAINS: console.porterchain.com
      PORTERCHAIN_SSO_JWT_SECRET: ${PORTERCHAIN_SSO_JWT_SECRET}
      PORTERCHAIN_FLEETBASE_DEFAULT_COMPANY_UUID: ${PORTERCHAIN_FLEETBASE_DEFAULT_COMPANY_UUID}
      PORTERCHAIN_FLEETBASE_DISPATCH_BRIDGE: "true"
      PORTERCHAIN_API_URL: http://api:8001

  socket:
    environment:
      SOCKETCLUSTER_OPTIONS: '{"origins":"https://console.porterchain.com:*,https://admin.porterchain.com:*,wss://console.porterchain.com:*,wss://admin.porterchain.com:*"}'
