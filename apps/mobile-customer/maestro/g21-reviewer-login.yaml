# G21 A-APR-01/03/07: review account signs in with email + password (no code, no CAPTCHA),
# sees PCDC orders, and can reach in-app account deletion. Build with
# EXPO_PUBLIC_REVIEWER_LOGIN_ENABLED=true. Run:
#   maestro test -e REVIEW_EMAIL=... -e REVIEW_PASSWORD=... maestro/g21-reviewer-login.yaml
appId: com.porterchain.customer
tags: [g21]
---
- launchApp
- assertVisible: { id: mobile-sign-in }
- assertVisible: { id: reviewer-sign-in }
- tapOn: { id: reviewer-email }
- inputText: ${REVIEW_EMAIL}
- tapOn: { id: reviewer-password }
- inputText: ${REVIEW_PASSWORD}
- tapOn: { id: reviewer-submit }
- assertNotVisible: { text: ".*(code|captcha|verify).*" }
- assertNotVisible: { id: reviewer-error }
- tapOn: { text: "Account" }
- scrollUntilVisible: { element: { text: "Request account deletion" } }
- assertVisible: { text: "Request account deletion" }
