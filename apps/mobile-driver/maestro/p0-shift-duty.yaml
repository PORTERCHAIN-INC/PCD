appId: com.porterchain.PCD
tags:
  - p0
  - shift
---
- launchApp
- assertVisible:
    id: mobile-sign-in
- tapOn:
    id: dev-sign-in
- extendedWaitUntil:
    visible:
      id: mobile-track
    timeout: 20000
# Off duty: vehicle check gates Go on duty. On duty: Go off duty is offered.
- runFlow:
    when:
      visible:
        id: pretrip-check
    commands:
      - assertVisible:
          id: go-on-duty
