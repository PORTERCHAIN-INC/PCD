appId: com.porterchain.PCD
---
- launchApp
- assertVisible:
    id: mobile-sign-in
- tapOn:
    id: dev-sign-in
- extendedWaitUntil:
    visible:
      id: mobile-track
    timeout: 20000
- tapOn:
    id: tab-job
- runFlow:
    when:
      visible:
        id: proof-card
    commands:
      - assertVisible:
          id: open-problem
- runFlow:
    when:
      visible:
        id: primary-signature
    commands:
      - tapOn:
          id: primary-signature
      - assertVisible:
          id: signature-pad
