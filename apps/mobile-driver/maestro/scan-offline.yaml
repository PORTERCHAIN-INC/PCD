appId: com.porterchain.PCD
---
- launchApp
- assertVisible:
    id: mobile-sign-in
- tapOn:
    id: dev-sign-in
- extendedWaitUntil:
    visible:
      id: mobile-track
    timeout: 20000
- tapOn:
    id: tab-job
- runFlow:
    when:
      visible:
        id: scan-card
    commands:
      - assertVisible:
          id: scan-camera
- runFlow:
    when:
      visible:
        id: banner-syncing
    commands:
      - assertVisible:
          id: banner-syncing
