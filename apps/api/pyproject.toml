[project]
name = "porterchain-api"
version = "0.1.0"
description = "Porterchain platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-jose[cryptography]>=3.3.0",
  "stripe>=11.0.0",
  "psycopg[binary]>=3.2.0",
  "firebase-admin>=6.6.0",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1",
  "redis>=5.2.0",
  "sentry-sdk[fastapi]>=2.19.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porterchain_api"]

[tool.pytest.ini_options]
markers = [
  "admin_p0: Admin/SuperAdmin P0 suite (docs/testing/admin_p0_registry.json)",
  "driver_p0: Driver + Admin-drivers P0 suite (docs/testing/driver_p0_registry.json)",
  "merchant_p0: Merchant portal + admin-merchant P0 suite (docs/testing/merchant_p0_registry.json)",
  "p0: alias for driver_p0 / admin_p0 / merchant_p0 smoke collections",
  "tc_id(id): SSOT test-case ID from docs/*_DEV_TEST* / merchant_p0_registry.json",
]
